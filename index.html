<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111315">

  <title>محمد صحرانورد | طراح گرافیک</title>
  <meta name="description" content="پورتفولیوی محمد صحرانورد، طراح گرافیک؛ مجموعه‌ای از بنرهای استوری، پوسترها و فتومونتاژها.">

  <!-- پیش‌نمایش لینک در شبکه‌های اجتماعی (بعد از اتصال دامنه، آدرس‌های زیر را کامل کنید) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="محمد صحرانورد | طراح گرافیک">
  <meta property="og:description" content="پورتفولیوی محمد صحرانورد، طراح گرافیک؛ مجموعه‌ای از بنرهای استوری، پوسترها و فتومونتاژها.">
  <meta property="og:image" content="Image/Image-13.jpg">
  <meta property="og:locale" content="fa_IR">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23262b32'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23e9b872' stroke-width='5'/%3E%3Ccircle cx='46' cy='18' r='4' fill='%23e9b872'/%3E%3C/svg%3E">

  <link rel="preload" href="font/Rokh-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="font/Rokh-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="Image/My-photo.png" as="image">

  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <!-- صفحه‌ی بارگذاری -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="در حال بارگذاری">
    <div class="loader__panel loader__panel--back" aria-hidden="true"></div>
    <div class="loader__panel">
      <span class="loader__blob loader__blob--a" aria-hidden="true"></span>
      <span class="loader__blob loader__blob--b" aria-hidden="true"></span>
      <div class="loader__center">
        <div class="loader__mark" aria-hidden="true">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle class="loader__orbit" cx="60" cy="60" r="46" fill="none" stroke="rgba(244,245,243,0.08)" stroke-width="1"/>
            <circle class="loader__ring" cx="60" cy="60" r="22" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" pathLength="100"/>
            <g class="loader__spin">
              <circle class="loader__dot" cx="60" cy="14" r="6" fill="var(--accent)"/>
            </g>
          </svg>
        </div>
        <p class="loader__name" data-bind="name"></p>
        <p class="loader__role" dir="ltr" data-bind="roleEn"></p>
        <div class="loader__bar" aria-hidden="true"><span class="loader__fill" id="loader-fill"></span></div>
        <span class="loader__pct" id="loader-pct" aria-hidden="true">۰٪</span>
      </div>
    </div>
  </div>

  <!-- فضای پس‌زمینه -->
  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--a"></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__blob bg__blob--c"></span>
    <span class="bg__noise"></span>
  </div>

  <!-- ناوبری -->
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
  <header class="nav" id="nav">
    <a class="nav__brand" href="#hero" aria-label="بازگشت به ابتدا">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <circle cx="32" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="5"/>
        <circle cx="46" cy="18" r="4" fill="var(--accent)"/>
      </svg>
    </a>
    <nav class="nav__menu" aria-label="ناوبری اصلی">
      <a href="#hero" class="nav__link is-active" data-nav="hero" data-bind="navHero"></a>
      <a href="#about" class="nav__link" data-nav="about" data-bind="navAbout"></a>
      <a href="#works" class="nav__link" data-nav="works" data-bind="navWorks"></a>
      <a href="#contact" class="nav__link" data-nav="contact" data-bind="navContact"></a>
      <a href="admin.html" class="nav__link nav__link--admin" data-nav="admin" rel="nofollow" title="ورود مدیر سایت">
        <svg class="nav__link-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>
        <span class="nav__link-text" data-bind="navAdmin"></span>
      </a>
      <span class="nav__pill" aria-hidden="true"></span>
    </nav>
  </header>

  <main id="main">

    <!-- ۰۱ — هیرو -->
    <section class="hero" id="hero" aria-labelledby="hero-name">
      <div class="hero__inner">

        <div class="hero__text">
          <p class="hero__greet" data-reveal data-bind="roleFa"></p>
          <h1 class="hero__name" id="hero-name" data-reveal data-bind="name"></h1>
          <p class="hero__role" data-reveal>
            <span class="hero__role-line" aria-hidden="true"></span>
            <span class="hero__role-en" dir="ltr" data-bind="roleEn"></span>
          </p>
        </div>

        <figure class="hero__figure" data-reveal>
          <span class="hero__halo" aria-hidden="true"></span>
          <span class="hero__ring" aria-hidden="true"></span>
          <div class="hero__icons" id="hero-icons" aria-label="نرم‌افزارهای تخصصی"></div>
          <img class="hero__photo" id="hero-photo" src="Image/My-photo.png" alt="" fetchpriority="high" decoding="async">
        </figure>

        <aside class="hero__stats" id="hero-stats" aria-label="خلاصه‌ی فعالیت"></aside>

        <div class="hero__cta" data-reveal>
          <a href="#works" class="pill pill--glass" data-magnetic>
            <span>مشاهده‌ی آثار</span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <span class="hero__hint" aria-hidden="true">
            <span class="hero__hint-line"></span>
            <span>اسکرول کنید</span>
          </span>
        </div>

      </div>
    </section>

    <!-- ۰۲ و ۰۳ — درباره و مهارت‌ها -->
    <section class="about" id="about" aria-labelledby="about-title">
      <div class="container about__grid">

        <article class="card card--intro" data-reveal>
          <header class="card__head">
            <span class="eyebrow" data-bind="aboutEyebrow"></span>
            <h2 class="card__title" id="about-title" data-bind="aboutHeading"></h2>
          </header>
          <p class="card__text" data-bind="aboutText"></p>

          <div class="card__divider" aria-hidden="true"></div>

          <h3 class="card__subtitle" data-bind="expHeading"></h3>
          <ul class="exp" id="exp-list"></ul>
        </article>

        <article class="card card--skills" data-reveal>
          <header class="card__head">
            <span class="eyebrow" data-bind="skillsEyebrow"></span>
            <h2 class="card__title" data-bind="skillsHeading"></h2>
          </header>
          <ul class="skills" id="skills-list"></ul>
        </article>

      </div>
    </section>

    <!-- ۰۴ — آثار -->
    <section class="works" id="works" aria-labelledby="works-title">
      <header class="section__head container" data-reveal>
        <span class="eyebrow" data-bind="worksEyebrow"></span>
        <h2 class="section__title" id="works-title" data-bind="worksHeading"></h2>
      </header>

      <div class="carousel" id="carousel" data-reveal>
        <div class="carousel__stage" id="stage" tabindex="0" role="region" aria-roledescription="گالری" aria-label="گالری آثار؛ برای مرور، بکشید یا از کلیدهای جهت استفاده کنید"></div>

        <div class="carousel__meta">
          <span class="carousel__tag" id="carousel-tag"></span>
          <span class="carousel__sep" aria-hidden="true"></span>
          <span class="carousel__count" id="carousel-count"></span>
        </div>

        <div class="carousel__rail" id="rail" aria-hidden="true">
          <span class="carousel__thumb" id="rail-thumb"></span>
        </div>

        <p class="carousel__hint" id="carousel-hint">برای مرور بکشید · برای مشاهده‌ی کامل، روی اثر ضربه بزنید</p>
      </div>
    </section>

    <!-- شعار / دعوت به گفتگو -->
    <section class="cta" id="cta" aria-labelledby="cta-title">
      <div class="container cta__inner" data-reveal>
        <span class="cta__glow" aria-hidden="true"></span>
        <span class="cta__orbit" aria-hidden="true"></span>
        <h2 class="cta__title" id="cta-title" data-bind="ctaText"></h2>
        <a href="#contact" class="cta__btn" id="cta-btn" data-magnetic>
          <span class="cta__btn-ring" aria-hidden="true"></span>
          <span class="cta__btn-ring cta__btn-ring--2" aria-hidden="true"></span>
          <span class="cta__btn-core">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="cta__btn-label" data-bind="ctaButton"></span>
        </a>
      </div>
    </section>

    <!-- ۰۵ — تماس -->
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <header class="section__head" data-reveal>
          <span class="eyebrow" data-bind="contactEyebrow"></span>
          <h2 class="section__title" id="contact-title" data-bind="contactHeading"></h2>
          <p class="section__lead" data-bind="contactLead"></p>
        </header>

        <div class="contact__grid">
          <a class="contact__card contact__card--phone" id="contact-phone" data-reveal data-magnetic>
            <span class="contact__label">تماس مستقیم</span>
            <span class="contact__value" dir="ltr" id="contact-phone-text"></span>
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
          </a>

          <div class="contact__card contact__card--id" data-reveal style="--d:0.1s">
            <span class="contact__label">شناسه در شبکه‌های اجتماعی</span>
            <span class="contact__value contact__value--id" dir="ltr" id="contact-id"></span>
            <ul class="socials" id="socials" aria-label="پلتفرم‌ها"></ul>
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.6 12v1.2a2.4 2.4 0 0 0 4.8 0V12a8.4 8.4 0 1 0-3.3 6.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </span>
          </div>

          <div class="contact__card contact__card--mail" data-reveal style="--d:0.2s">
            <span class="contact__label">ایمیل</span>
            <span class="contact__value" dir="ltr" id="contact-email"></span>
            <span class="contact__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="5.5" width="17" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__legal" id="footer-legal"></p>
      <p class="footer__meta"><span data-bind="name"></span><span class="footer__dot" aria-hidden="true"></span><span id="footer-year"></span></p>
    </div>
  </footer>

  <!-- نمایش تمام‌صفحه‌ی اثر -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="نمایش اثر" hidden>
    <div class="lightbox__backdrop" data-lb-close></div>
    <button class="lightbox__btn lightbox__btn--close" type="button" data-lb-close aria-label="بستن">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="lightbox__btn lightbox__btn--prev" type="button" data-lb-prev aria-label="اثر قبلی">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="lightbox__btn lightbox__btn--next" type="button" data-lb-next aria-label="اثر بعدی">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
    </figure>
    <div class="lightbox__info">
      <span class="lightbox__tag" id="lightbox-tag"></span>
      <p class="lightbox__desc" id="lightbox-desc"></p>
      <span class="lightbox__count" id="lightbox-count"></span>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
